<!doctype html>
<html lang="en">
  <head>
    <script>
      // 主题防闪烁：默认暖色浅色，仅当用户明确选择过深色时才加 dark
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var dark = t === "dark" || t === '"dark"';
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* keep light */
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf7f0" />
    <title>PPEELink 节点订阅管理系统</title>
  </head>

  <body>
    <div id="app">
      <div class="loader"></div>
    </div>
  </body>
  <script type="module" src="/src/main.ts"></script>

  <style>
    html,
    body,
    #app {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    html {
      background: #faf7f0;
    }

    html.dark {
      background: #17120a;
    }

    .loader {
      position: relative;
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: inset 0 0 0 1px #ecdfc8;
    }

    html.dark .loader {
      background: #271f14;
      box-shadow: inset 0 0 0 1px #3b2f1e;
    }

    .loader::before {
      position: absolute;
      inset: 0;
      border-radius: 14px;
      background: conic-gradient(from 90deg, transparent 0 65%, #e8960f 100%);
      mask: radial-gradient(
        farthest-side,
        transparent calc(100% - 3px),
        #000 calc(100% - 2px)
      );
      -webkit-mask: radial-gradient(
        farthest-side,
        transparent calc(100% - 3px),
        #000 calc(100% - 2px)
      );
      animation: lspin 1.05s linear infinite;
      content: "";
    }

    html.dark .loader::before {
      background: conic-gradient(from 90deg, transparent 0 65%, #f2ad3a 100%);
    }

    .loader::after {
      width: 10px;
      height: 10px;
      border-radius: 4px;
      background: #e8960f;
      box-shadow: 0 0 18px rgba(232, 150, 15, 0.55);
      animation: lpulse 1.4s ease-in-out infinite;
      content: "";
    }

    html.dark .loader::after {
      background: #f2ad3a;
      box-shadow: 0 0 18px rgba(242, 173, 58, 0.6);
    }

    @keyframes lspin {
      to {
        transform: rotate(1turn);
      }
    }

    @keyframes lpulse {
      0%,
      100% {
        opacity: 0.55;
        transform: scale(0.88);
      }
      50% {
        opacity: 1;
        transform: scale(1.12);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader::before,
      .loader::after {
        animation: none;
      }
    }
  </style>
</html>
