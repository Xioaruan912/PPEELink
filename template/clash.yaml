allow-lan: true
dns:
    default-nameserver:
        - 223.5.5.5
        - 223.6.6.6
    enable: true
    enhanced-mode: fake-ip
    fake-ip-filter:
        - '*'
        - +.lan
    fake-ip-range: 28.0.0.1/8
    ipv6: false
    listen: 0.0.0.0:1053
    nameserver:
        - https://223.5.5.5/dns-query
        - https://223.6.6.6/dns-query
    prefer-h3: true
external-controller: 127.0.0.1:9090
find-process-mode: strict
geo-auto-update: true
geo-update-interval: 24
geodata-loader: standard
geodata-mode: false
geox-url:
    asn: https://geodata.kelee.one/GeoLite2-ASN-P3TERX.mmdb
    mmdb: https://geodata.kelee.one/Country-Masaiki.mmdb
global-client-fingerprint: chrome
ipv6: true
listeners:
    - listen: 0.0.0.0
      name: socks5-in-1
      port: 10808
      proxy: DIRECT
      type: socks
      udp: true
      users: []
log-level: info
mixed-port: 7892
mode: rule
port: 7890
profile:
    store-fake-ip: true
    store-selected: true
proxies: ~
proxy-groups:
    - include-all-providers: true
      name: 日常使用
      proxies:
        - DIRECT
      type: select
    - filter: (?i)JP|USA
      include-all-providers: true
      name: Gemini
      proxies:
        - DIRECT
      type: select
    - filter: (?i)US|USA|United States|美国|JP|Japan|新加坡|SG|Singapore|英国|UK|GB
      include-all-providers: true
      name: ChatGPT
      proxies:
        - DIRECT
      type: select
    - filter: (?i)US|USA|United States|美国|JP|EG
      include-all-providers: true
      name: AI
      proxies:
        - DIRECT
      type: select
redir-port: 7893
rule-providers:
    "115":
        behavior: classical
        format: yaml
        interval: 3600
        path: ./rules/115.yaml
        proxy: 日常使用
        type: http
        url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/115/115.yaml
    AI:
        behavior: classical
        format: yaml
