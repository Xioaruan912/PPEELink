rules:
    - RULE-SET, LAN, DIRECT
    - RULE-SET, Direct, DIRECT
    - RULE-SET, ESET_China, DIRECT
    - RULE-SET, Google, Gemini
    - RULE-SET, Gemini, Gemini
    - RULE-SET, ChatGPT, ChatGPT
    - RULE-SET,Anthropic,ChatGPT
    - RULE-SET, Proxy, 日常使用
    - GEOIP, CN, DIRECT
    - RULE-SET,115,DIRECT
    - RULE-SET,Microsoft,日常使用
    - RULE-SET,Xbox,日常使用
    - RULE-SET,Discord,日常使用
    - RULE-SET,Reddit,ChatGPT
    - RULE-SET,Whatsapp,ChatGPT
    - MATCH, 日常使用
sniffer:
    enable: true
    force-dns-mapping: true
    force-domain:
        - +.v2ex.com
    override-destination: true
    parse-pure-ip: true
    skip-domain:
        - Mijia Cloud
    sniff:
        HTTP:
            override-destination: true
            ports:
                - 80
                - 8080-8880
        QUIC:
            ports:
                - 443
                - 8443
        TLS:
            ports:
                - 443
                - 8443
socks-port: 7891
tcp-concurrent: true
tproxy-port: 7894
tun:
    auto-detect-interface: true
    auto-route: true
    dns-hijack:
        - any:53
    enable: true
    stack: system
udp: true
unified-delay: true
