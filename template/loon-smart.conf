[Remote Filter]
# 地区筛选
美国 = NameRegex, FilterKey = "(?i)(美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|🇺🇸|US|USA)"
香港 = NameRegex, FilterKey = "(?i)(香港|hong|HK|HKG|🇭🇰)"
日本 = NameRegex, FilterKey = "(?i)(日本|东京|大阪|泉日|埼玉|🇯🇵|JP|Japan)"
新加坡 = NameRegex, FilterKey = "(?i)(狮城|新加坡|🇸🇬|SG|Singapore)"
台湾 = NameRegex, FilterKey = "(?i)(台湾|台灣|🇹🇼|TW|Taiwan)"
# 解锁矩阵实时联动筛选（由 PPEELink 自动同步）
ChatGPT解锁 = NameRegex, FilterKey = "(?i)US|USA|United States|美国|JP|Japan|日本|SG|Singapore|新加坡|UK|GB|英国"
Claude解锁 = NameRegex, FilterKey = "(?i)US|USA|United States|美国|JP|Japan|日本|SG|Singapore|新加坡|UK|GB|英国"
Gemini解锁 = NameRegex, FilterKey = "(?i)US|USA|United States|美国|JP|Japan|日本|SG|Singapore|新加坡|TW|台湾"
Netflix解锁 = NameRegex, FilterKey = "(?i)US|USA|JP|HK|SG|TW|UK"
Disney解锁 = NameRegex, FilterKey = "(?i)US|USA|JP|HK|SG|TW|UK"
TikTok解锁 = NameRegex, FilterKey = "(?i)US|USA|JP|SG|TW|UK"

