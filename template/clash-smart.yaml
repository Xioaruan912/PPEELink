allow-lan: true
dns:
    default-nameserver:
        - 223.5.5.5
        - 223.6.6.6
    enable: true
    enhanced-mode: fake-ip
    fake-ip-filter:
        - '*'
        - +.lan
    fake-ip-range: 28.0.0.1/8
    ipv6: false
    listen: 0.0.0.0:1053
    nameserver:
        - https://223.5.5.5/dns-query
        - https://223.6.6.6/dns-query
    prefer-h3: true
external-controller: 127.0.0.1:9090
find-process-mode: strict
geo-auto-update: true
geo-update-interval: 24
geodata-loader: standard
geodata-mode: false
geox-url:
    asn: https://geodata.kelee.one/GeoLite2-ASN-P3TERX.mmdb
    mmdb: https://geodata.kelee.one/Country-Masaiki.mmdb
ipv6: true
listeners:
    - listen: 0.0.0.0
      name: socks5-in-1
      port: 10808
      proxy: DIRECT
      type: socks
      udp: true
      users: []
log-level: info
mixed-port: 7892
mode: rule
port: 7890
profile:
    store-fake-ip: true
    store-selected: true
proxies: ~
proxy-groups:
    - include-all-providers: true
      name: 日常使用
      proxies: []
      type: select
    - filter: (?i)US|USA|United States|美国|JP|Japan|日本|SG|Singapore|新加坡|UK|GB|英国
      include-all-providers: true
      name: ChatGPT
      proxies: []
      type: select
    - filter: (?i)US|USA|United States|美国|JP|Japan|日本|SG|Singapore|新加坡|UK|GB|英国
      include-all-providers: true
      name: Claude
      proxies: []
      type: select
    - filter: (?i)US|USA|United States|美国|JP|Japan|日本|SG|Singapore|新加坡|TW|台湾
      include-all-providers: true
      name: Gemini
      proxies: []
      type: select
    - filter: (?i)US|USA|JP|HK|SG|TW|UK
      include-all-providers: true
      name: Netflix
      proxies: []
      type: select
    - filter: (?i)US|USA|JP|HK|SG|TW|UK
      include-all-providers: true
      name: Disney+
      proxies: []
      type: select
    - filter: (?i)US|USA|JP|SG|TW|UK
      include-all-providers: true
      name: TikTok
      proxies: []
      type: select
redir-port: 7893
