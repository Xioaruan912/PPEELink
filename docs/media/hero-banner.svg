<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0d12"/>
      <stop offset="55%" stop-color="#111622"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <radialGradient id="glow" cx="76%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0b0d12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc1" x1="560" y1="220" x2="1080" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="arc2" x1="650" y1="250" x2="990" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <style>
      .grid { stroke: rgba(255,255,255,0.045); stroke-width: 1; }
      .word { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif; fill: #f8fafc; font-weight: 600; letter-spacing: 0.08em; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; fill: #94a3b8; font-size: 16px; letter-spacing: 0.02em; }
      .meta { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #64748b; font-size: 12px; letter-spacing: 0.06em; }
      .city { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: rgba(226,232,240,0.65); font-size: 11px; }
      .dash { stroke-dasharray: 4 6; animation: flow 22s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -220; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="19.5" stroke="rgba(255,255,255,0.08)"/>

  <!-- Subtle cartographic graticules on right -->
  <g class="grid">
    <line x1="580" y1="64" x2="1140" y2="64"/>
    <line x1="580" y1="128" x2="1140" y2="128"/>
    <line x1="580" y1="192" x2="1140" y2="192"/>
    <line x1="580" y1="256" x2="1140" y2="256"/>
    <line x1="660" y1="36" x2="660" y2="284"/>
    <line x1="780" y1="36" x2="780" y2="284"/>
    <line x1="900" y1="36" x2="900" y2="284"/>
    <line x1="1020" y1="36" x2="1020" y2="284"/>
  </g>

  <!-- Animated fiber routes -->
  <path id="routeA" d="M620,218 Q790,72 1065,112" stroke="url(#arc1)" stroke-width="1.8" class="dash" fill="none"/>
  <path id="routeB" d="M620,218 Q755,156 896,178" stroke="url(#arc2)" stroke-width="1.5" class="dash" fill="none"/>
  <path id="routeC" d="M896,178 Q985,126 1065,112" stroke="url(#arc1)" stroke-width="1.4" class="dash" fill="none"/>
  <path id="routeD" d="M742,138 Q875,92 1065,112" stroke="rgba(148,163,184,0.28)" stroke-width="1.1" fill="none"/>

  <!-- Moving light packets -->
  <circle r="5" fill="#10b981" filter="url(#blur)">
    <animateMotion dur="4.2s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1">
      <mpath href="#routeA"/>
    </animateMotion>
  </circle>
  <circle r="2.6" fill="#ecfdf5">
    <animateMotion dur="4.2s" repeatCount="indefinite">
      <mpath href="#routeA"/>
    </animateMotion>
  </circle>

  <circle r="4.5" fill="#38bdf8" filter="url(#blur)">
    <animateMotion dur="3.1s" repeatCount="indefinite" begin="0.8s">
      <mpath href="#routeB"/>
    </animateMotion>
  </circle>
  <circle r="2.3" fill="#f0f9ff">
    <animateMotion dur="3.1s" repeatCount="indefinite" begin="0.8s">
      <mpath href="#routeB"/>
    </animateMotion>
  </circle>

  <circle r="4" fill="#10b981" filter="url(#blur)">
    <animateMotion dur="2.6s" repeatCount="indefinite" begin="1.4s">
      <mpath href="#routeC"/>
    </animateMotion>
  </circle>

  <!-- Node beacons -->
  <g transform="translate(620,218)">
    <circle r="10" fill="#10b981" opacity="0.18">
      <animate attributeName="r" values="6;14;6" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.04;0.3" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#10b981"/>
    <text x="12" y="4" class="city">HKG · 12ms</text>
  </g>
  <g transform="translate(742,138)">
    <circle r="3.5" fill="#94a3b8"/>
    <text x="10" y="4" class="city">FRA</text>
  </g>
  <g transform="translate(896,178)">
    <circle r="9" fill="#38bdf8" opacity="0.18">
      <animate attributeName="r" values="5;12;5" dur="3.2s" repeatCount="indefinite" begin="0.6s"/>
      <animate attributeName="opacity" values="0.28;0.04;0.28" dur="3.2s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <circle r="3.8" fill="#38bdf8"/>
    <text x="12" y="4" class="city">SIN · 28ms</text>
  </g>
  <g transform="translate(1065,112)">
    <circle r="10" fill="#10b981" opacity="0.2">
      <animate attributeName="r" values="6;15;6" dur="2.6s" repeatCount="indefinite" begin="1.1s"/>
      <animate attributeName="opacity" values="0.32;0.04;0.32" dur="2.6s" repeatCount="indefinite" begin="1.1s"/>
    </circle>
    <circle r="4.2" fill="#10b981"/>
    <text x="-52" y="-12" class="city">NRT · 34ms</text>
  </g>

  <!-- Left Wordmark & Copy -->
  <g transform="translate(64, 96)">
    <text x="0" y="34" font-size="38" class="word">PPEE</text>
    <!-- Kinetic ring beacon -->
    <g transform="translate(136, 21)">
      <circle r="13" stroke="#f8fafc" stroke-width="2.4" fill="none"/>
      <circle r="4" fill="#10b981">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="164" y="34" font-size="38" class="word">LINK</text>

    <text x="2" y="82" class="sub">自建代理节点、订阅分发与多视角网络探测面板</text>
    <text x="2" y="138" class="meta">GO 1.25 · VUE 3 · XRAY-CORE · SING-BOX · AGENT V1.18</text>
  </g>
</svg>
